[workspace]
resolver = "2"
members = [
    "crates/arpg-core",
    "crates/arpg-data",
    "crates/arpg-rules",
    "crates/arpg-sim",
    "crates/arpg-world",
    "crates/arpg-ai",
    "crates/arpg-protocol",
    "crates/arpg-server",
    "crates/arpg-persistence",
    "crates/arpg-replay",
    "crates/arpg-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arpg-core = { path = "crates/arpg-core" }
arpg-data = { path = "crates/arpg-data" }
arpg-rules = { path = "crates/arpg-rules" }
arpg-sim = { path = "crates/arpg-sim" }
arpg-world = { path = "crates/arpg-world" }
arpg-ai = { path = "crates/arpg-ai" }
arpg-protocol = { path = "crates/arpg-protocol" }
arpg-server = { path = "crates/arpg-server" }
arpg-persistence = { path = "crates/arpg-persistence" }
arpg-replay = { path = "crates/arpg-replay" }
arpg-tools = { path = "crates/arpg-tools" }

smallvec = "1"
bitflags = "2"
thiserror = "1"
blake3 = "1"
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
csv = "1"
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
prost = "0.13"
sqlx = { version = "0.8", default-features = false }
proptest = "1"
criterion = "0.5"

[profile.release]
debug = true

[profile.release.package."*"]
debug = false
